[platformio]
default_envs = esp32c3
description = ESP32-C3 双控网关：当贝投影仪 + 尼特利滤桶 -> Home Assistant

[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; 固件约 1.6MB，默认分区放不下，用 huge_app（3MB app 分区）
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

; 必须全局定义：让 BleKeyboard 使用 NimBLE 协议栈，
; 否则它会拉进来一套 Bluedroid，和滤桶的 GATT 客户端抢内存
build_flags =
    -DUSE_NIMBLE

lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

; lib/ESP32-BLE-Keyboard 是打过补丁的本地副本（见 README「关于那个补丁」），
; PlatformIO 会自动把它编进去，不需要手动改系统库
lib_ldf_mode = deep+

[env:esp32c3_ota]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
build_flags = -DUSE_NIMBLE
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
upload_protocol = espota
upload_port = 10.0.0.54
upload_flags =
    --auth=

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="esp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="url(#bg)"/>

  <text x="480" y="44" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">ESP32-C3 双控网关 · 数据流向</text>
  <text x="480" y="68" fill="#8b949e" font-size="13" text-anchor="middle">一块板子，两种 BLE 角色，全部走局域网</text>

  <!-- 投影仪 -->
  <rect x="40" y="130" width="200" height="120" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="140" y="162" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">当贝投影仪</text>
  <text x="140" y="186" fill="#8b949e" font-size="12" text-anchor="middle">深度休眠会过滤普通键盘</text>
  <text x="140" y="208" fill="#f0883e" font-size="12" text-anchor="middle">ESP32 = Peripheral 从机</text>
  <text x="140" y="228" fill="#8b949e" font-size="12" text-anchor="middle">HID 键盘 + 唤醒信标</text>

  <!-- ESP32 -->
  <rect x="380" y="110" width="200" height="160" rx="14" fill="url(#esp)"/>
  <text x="480" y="145" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">ESP32-C3</text>
  <text x="480" y="170" fill="#cfe3ff" font-size="12" text-anchor="middle">NimBLE · BLE 双角色</text>
  <line x1="405" y1="184" x2="555" y2="184" stroke="#7cb3ff" stroke-opacity="0.4"/>
  <text x="480" y="206" fill="#eaf2ff" font-size="12" text-anchor="middle">Mode A 唤醒 / Mode B 控制</text>
  <text x="480" y="228" fill="#eaf2ff" font-size="12" text-anchor="middle">RTC_NOINIT + NVS 固化</text>
  <text x="480" y="250" fill="#cfe3ff" font-size="12" text-anchor="middle">HTTP :80</text>

  <!-- 滤桶 -->
  <rect x="720" y="130" width="200" height="120" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="820" y="162" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">尼特利变频滤桶</text>
  <text x="820" y="186" fill="#8b949e" font-size="12" text-anchor="middle">单连接 · 明文协议</text>
  <text x="820" y="208" fill="#3fb950" font-size="12" text-anchor="middle">ESP32 = Central 主机</text>
  <text x="820" y="228" fill="#8b949e" font-size="12" text-anchor="middle">GATT 读写 · XOR 混淆</text>

  <!-- 箭头 投影仪 <-> ESP32 -->
  <line x1="244" y1="170" x2="374" y2="170" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="309" y="160" fill="#8b949e" font-size="11" text-anchor="middle">BLE</text>

  <!-- 箭头 ESP32 <-> 滤桶 -->
  <line x1="586" y1="170" x2="716" y2="170" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="651" y="160" fill="#8b949e" font-size="11" text-anchor="middle">BLE</text>

  <!-- Home Assistant -->
  <rect x="340" y="320" width="280" height="72" rx="12" fill="#21262d" stroke="#41bdf5"/>
  <text x="480" y="348" fill="#41bdf5" font-size="15" font-weight="600" text-anchor="middle">Home Assistant</text>
  <text x="480" y="372" fill="#8b949e" font-size="12" text-anchor="middle">RESTful command / sensor · 局域网直连</text>

  <line x1="480" y1="274" x2="480" y2="316" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="492" y="300" fill="#58a6ff" font-size="11">WiFi / HTTP</text>

  <!-- 手机 -->
  <rect x="40" y="320" width="200" height="72" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="140" y="348" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">手机 / 配网</text>
  <text x="140" y="370" fill="#8b949e" font-size="11" text-anchor="middle">Dangbei-Setup 热点</text>

  <rect x="720" y="320" width="200" height="72" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="820" y="348" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">官方小程序</text>
  <text x="820" y="370" fill="#8b949e" font-size="11" text-anchor="middle">ESP32 空闲时可同时用</text>
</svg>
